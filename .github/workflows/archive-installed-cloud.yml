          'REA_INSTALLED_EVIDENCE=' + $evidence | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'REA_BROWSER_EVIDENCE=' + $evidence | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'PLAYWRIGHT_BROWSERS_PATH=' + (Join-Path $env:RUNNER_TEMP ('rea-playwright-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Acquire locked browser tooling and matching Chromium
        id: acquire
        shell: pwsh
        run: node products/rea-studio/scripts/verify-cloud-browser.mjs --phase acquire --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Authenticate all 62 committed Archive files and 21 exact after pins
        id: before
        shell: pwsh
        run: node products/rea-studio/scripts/verify-archive-installed-cloud.mjs --phase before --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Execute six real-browser scenarios on installed committed sources
        id: verify
        shell: pwsh
        run: |
          $source = Join-Path $env:REA_INSTALLED_EVIDENCE 'archive-installed-source-check.json'
          node products/rea-studio/scripts/verify-cloud-browser.mjs --phase verify --evidence "$env:REA_INSTALLED_EVIDENCE" --scope archive-aes-installed --installed-manifest "$source"
      - name: Independently reauthenticate all 62 files after every started attempt
        id: after
        if: always() && steps.before.outcome == 'success'
        shell: pwsh
        run: node products/rea-studio/scripts/verify-archive-installed-cloud.mjs --phase after --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Independently recheck full browser census and every eligible Git blob
        id: browserpost
        if: always() && steps.before.outcome == 'success'
        shell: pwsh
        run: |
          $source = Join-Path $env:REA_INSTALLED_EVIDENCE 'archive-installed-source-check.json'
          node products/rea-studio/scripts/verify-cloud-browser.mjs --phase postcheck --evidence "$env:REA_INSTALLED_EVIDENCE" --scope archive-aes-installed --installed-manifest "$source"
      - name: Package bounded complete portable evidence

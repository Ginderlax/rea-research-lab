name: Committed Archive AES and timestamps acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, codex/rea-cloud-recovery-20261015]
    paths:
      - '.github/workflows/archive-installed-cloud.yml'
      - 'products/rea-studio/scripts/verify-archive-installed-cloud.mjs'
      - 'products/rea-studio/scripts/verify-cloud.mjs'
      - 'products/rea-studio/scripts/verify-cloud-browser.mjs'
      - 'products/rea-studio/apps/archive/**'
      - 'products/rea-studio/browser-tests/archive-aes.spec.mjs'
      - 'products/rea-studio/browser-tests/playwright.archive-aes.config.mjs'
      - 'products/rea-studio/browser-tests/archive-aes-roster.json'
      - 'products/rea-studio/browser-tests/package.json'
      - 'products/rea-studio/browser-tests/package-lock.json'
      - 'products/rea-studio/lib/**'
      - 'products/rea-studio/public/**'
      - 'products/rea-studio/server.mjs'
      - 'products/rea-studio/catalog.mjs'
      - 'products/rea-studio/package.json'
      - 'products/rea-studio/experiments/archive-aes/**'

permissions:
  contents: read
concurrency:
  group: archive-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finite-thirteen-file-selection:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Enable long research paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out the exact requested source revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Select pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          architecture: x64
          check-latest: false
      - name: Select owned evidence outside source paths
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-finite-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          'REA_INSTALLED_EVIDENCE=' + $evidence | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'ARCHIVE_AES_OBSERVATIONS=' + (Join-Path $evidence 'observations') | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Authenticate all 62 committed Archive files and 21 exact after pins
        id: before
        shell: pwsh
        run: node products/rea-studio/scripts/verify-archive-installed-cloud.mjs --phase before --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Acquire pinned original 7-Zip inputs without comparison execution
        id: acquire
        shell: pwsh
        run: node products/rea-studio/scripts/verify-archive-installed-cloud.mjs --phase bootstrap --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Execute 13 installed Archive test files with 161 groups
        id: verify
        shell: pwsh
        run: |
          $output = Join-Path $env:REA_INSTALLED_EVIDENCE 'verification'
          $source = Join-Path $env:REA_INSTALLED_EVIDENCE 'archive-installed-source-check.json'
          $original = Join-Path $env:REA_INSTALLED_EVIDENCE 'original-acquisition.json'
          node products/rea-studio/scripts/verify-cloud.mjs --scope archive-aes-installed --output "$output" --installed-manifest "$source" --bootstrap-manifest "$original" --timeout-ms 1200000
      - name: Execute three corrected bounds groups separately from finite161
        id: bounds
        if: always() && steps.before.outcome == 'success'
        shell: pwsh
        run: node products/rea-studio/scripts/verify-archive-installed-cloud.mjs --phase bounds --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Independently reauthenticate all 62 files after every started attempt
        id: after
        if: always() && steps.before.outcome == 'success'
        shell: pwsh
        run: node products/rea-studio/scripts/verify-archive-installed-cloud.mjs --phase after --evidence "$env:REA_INSTALLED_EVIDENCE"
      - name: Package bounded complete portable evidence
        id: evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = $env:REA_INSTALLED_EVIDENCE
          if (-not $evidence) { $evidence = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-finite-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT) }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          @{schema='rea-archive-installed-finite-workflow-attempt/v1';boundsOutcome='${{ steps.bounds.outcome }}';boundsGroupsSeparateFromFinite161=$true;sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;runnerEnvironment=$env:RUNNER_ENVIRONMENT;checkoutOutcome='${{ steps.checkout.outcome }}';sourceBeforeOutcome='${{ steps.before.outcome }}';acquisitionOutcome='${{ steps.acquire.outcome }}';verificationOutcome='${{ steps.verify.outcome }}';sourceAfterOutcome='${{ steps.after.outcome }}';sourceOverlay=$false;installationPerformedByWorkflow=$false;productionInstallationReceiptVerified=$false;acceptancePreclaimed=$false;historicalReceiptsRebound=$false;fullArchiveSuite=$false;fullParity=$false;superiority=$false}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $evidence 'installed-workflow-attempt.json') -Encoding utf8
          $files = @(Get-ChildItem -LiteralPath $evidence -File -Recurse)
          $rawBytes = ($files | Measure-Object Length -Sum).Sum
          $bounded = $files.Count -le 2500 -and $rawBytes -le 96*1024*1024 -and @($files | Where-Object {$_.Length -gt 8*1024*1024}).Count -eq 0
          $archive = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-finite-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if ($bounded) { [IO.Compression.ZipFile]::CreateFromDirectory($evidence,$archive,[IO.Compression.CompressionLevel]::Optimal,$false) }
          $archiveBytes = if ($bounded) {(Get-Item -LiteralPath $archive).Length} else {$null}
          if (-not $bounded -or $archiveBytes -gt 15*1024*1024) {
            $fallback = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-finite-incomplete-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
            New-Item -ItemType Directory -Path $fallback | Out-Null
            $retained = @(); $omitted = @()
            foreach ($file in Get-ChildItem -LiteralPath $evidence -File) {
              if ($file.Length -le 1024*1024) { Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $fallback $file.Name); $retained += $file.Name }
              else { $omitted += @{file=$file.Name;bytes=$file.Length} }
            }
            @{schema='rea-cloud-evidence-storage-failure/v1';status='failed';rawFiles=$files.Count;rawBytes=$rawBytes;rawFileLimit=2500;rawByteLimit=96*1024*1024;individualByteLimit=8*1024*1024;fullArchiveBytes=$archiveBytes;zipLimit=15*1024*1024;completeEvidenceUploaded=$false;sourceSnapshotsUploaded=$false;rawLogsComplete=$false;retainedFiles=$retained;omittedTopLevelFiles=$omitted;reason='Complete installed Archive evidence exceeded a fixed bound; this fallback cannot certify portable acceptance.'}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $fallback 'storage-failure.json') -Encoding utf8
            $archive = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-finite-incomplete-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
            [IO.Compression.ZipFile]::CreateFromDirectory($fallback,$archive,[IO.Compression.CompressionLevel]::Optimal,$false)
            if ((Get-Item -LiteralPath $archive).Length -le 15*1024*1024) { 'artifact_path=' + $archive | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
            throw 'Complete installed Archive evidence exceeded a fixed bound; the fallback is explicitly incomplete.'
          }
          'artifact_path=' + $archive | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Preserve complete success or failure evidence
        if: always() && steps.evidence.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-installed-finite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  six-real-chromium-scenarios:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Enable long research paths
        shell: pwsh
        run: git config --global core.longpaths true

        if: always()
        shell: pwsh
        run: |
          $evidence = $env:REA_INSTALLED_EVIDENCE
          if (-not $evidence) { $evidence = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-browser-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT) }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          @{schema='rea-archive-installed-browser-workflow-attempt/v1';sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;runnerEnvironment=$env:RUNNER_ENVIRONMENT;checkoutOutcome='${{ steps.checkout.outcome }}';sourceBeforeOutcome='${{ steps.before.outcome }}';acquisitionOutcome='${{ steps.acquire.outcome }}';verificationOutcome='${{ steps.verify.outcome }}';sourceAfterOutcome='${{ steps.after.outcome }}';browserPostcheckOutcome='${{ steps.browserpost.outcome }}';sourceOverlay=$false;installationPerformedByWorkflow=$false;productionInstallationReceiptVerified=$false;acceptancePreclaimed=$false;historicalReceiptsRebound=$false;fullArchiveSuite=$false;fullParity=$false;superiority=$false}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $evidence 'installed-workflow-attempt.json') -Encoding utf8
          $files = @(Get-ChildItem -LiteralPath $evidence -File -Recurse)
          $rawBytes = ($files | Measure-Object Length -Sum).Sum
          $bounded = $files.Count -le 2500 -and $rawBytes -le 96*1024*1024 -and @($files | Where-Object {$_.Length -gt 8*1024*1024}).Count -eq 0
          $archive = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-browser-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if ($bounded) { [IO.Compression.ZipFile]::CreateFromDirectory($evidence,$archive,[IO.Compression.CompressionLevel]::Optimal,$false) }
          $archiveBytes = if ($bounded) {(Get-Item -LiteralPath $archive).Length} else {$null}
          if (-not $bounded -or $archiveBytes -gt 15*1024*1024) {
            $fallback = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-browser-incomplete-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
            New-Item -ItemType Directory -Path $fallback | Out-Null
            $retained = @(); $omitted = @()
            foreach ($file in Get-ChildItem -LiteralPath $evidence -File) {
              if ($file.Length -le 1024*1024) { Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $fallback $file.Name); $retained += $file.Name }
              else { $omitted += @{file=$file.Name;bytes=$file.Length} }
            }
            @{schema='rea-cloud-evidence-storage-failure/v1';status='failed';rawFiles=$files.Count;rawBytes=$rawBytes;rawFileLimit=2500;rawByteLimit=96*1024*1024;individualByteLimit=8*1024*1024;fullArchiveBytes=$archiveBytes;zipLimit=15*1024*1024;completeEvidenceUploaded=$false;sourceSnapshotsUploaded=$false;rawLogsComplete=$false;retainedFiles=$retained;omittedTopLevelFiles=$omitted;reason='Complete installed Archive evidence exceeded a fixed bound; this fallback cannot certify portable acceptance.'}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $fallback 'storage-failure.json') -Encoding utf8
            $archive = Join-Path $env:RUNNER_TEMP ('rea-archive-installed-browser-incomplete-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
            [IO.Compression.ZipFile]::CreateFromDirectory($fallback,$archive,[IO.Compression.CompressionLevel]::Optimal,$false)
            if ((Get-Item -LiteralPath $archive).Length -le 15*1024*1024) { 'artifact_path=' + $archive | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
            throw 'Complete installed Archive evidence exceeded a fixed bound; the fallback is explicitly incomplete.'
          }

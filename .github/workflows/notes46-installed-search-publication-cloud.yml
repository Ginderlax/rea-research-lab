          $record=@{schema='rea-notes46-owned-workflow-process/v1';role=$role;sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;job=$env:GITHUB_JOB;script=$script;argument=$argument;nodeExecutable=$nodeExecutable;nodeVersion=$nodeVersion[0];nodeCandidateCount=$nodeCommands.Count;nodeResolution='first ApplicationInfo in actual PATH order';startedAtUtc=[DateTime]::UtcNow.ToString('o');exitCode=$null;closeObserved=$false;timedOut=$false;failure=$null;rawStreamEncodingConversion=$false;stdoutCap=4*1024*1024;stderrCap=1024*1024;comprehensiveAuditFailureWaived=$false}

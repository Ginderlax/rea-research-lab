      - name: Package bounded portable raw evidence even on failure
        id: evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('rea-notes46-publication-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (!(Test-Path -LiteralPath $evidence)) { New-Item -ItemType Directory -Path $evidence | Out-Null }
          function Assert-NoEvidenceLinks([string]$filename) {
            $at=[IO.Path]::GetFullPath($filename)
            while($true){$item=Get-Item -LiteralPath $at -Force;if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Evidence ancestor links refused'};$parent=[IO.Path]::GetDirectoryName($at);if(!$parent -or $parent -eq $at){break};$at=$parent}
          }
          Assert-NoEvidenceLinks $evidence
          $launcher=Join-Path $env:RUNNER_TEMP ('rea-notes46-publication-launcher-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $launcher){
            Assert-NoEvidenceLinks $launcher
            foreach($name in @('workflow-process.json','workflow-process.stdout.txt','workflow-process.stderr.txt')){
              $src=Join-Path $launcher $name
              if(Test-Path -LiteralPath $src -PathType Leaf){
                Assert-NoEvidenceLinks $src;$item=Get-Item -LiteralPath $src -Force;if($item.Length -gt 4*1024*1024){throw 'Launcher member cap exceeded'}
                $bytes=[IO.File]::ReadAllBytes($src);$dst=Join-Path $evidence $name;$stream=[IO.File]::Open($dst,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                try{$stream.Write($bytes,0,$bytes.Length);$stream.Flush($true)}finally{$stream.Dispose()}
                if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash){throw 'Launcher raw copy differs'}
              }
            }
          }
          $attempt = @{ schema='rea-notes46-publication-audit-workflow-attempt/v1'; role='publication'; sourceCommit=$env:GITHUB_SHA; branch=$env:GITHUB_REF; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; job=$env:GITHUB_JOB; runnerEnvironment=$env:RUNNER_ENVIRONMENT; checkoutOutcome='${{ steps.checkout.outcome }}'; bootstrapOutcome='${{ steps.bootstrap.outcome }}'; processOutcome='${{ steps.qualify.outcome }}'; statusBeforePackaging='${{ job.status }}'; comprehensiveAuditFailureWaived=$false; historicalReceiptsRebound=$false; defaultBranchInstallationClaimed=$false; fullParity=$false; superiority=$false }
          $attempt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'notes46-workflow-attempt.json') -Encoding utf8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $env:RUNNER_TEMP ('rea-notes46-publication-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
          $failure = $null
          try {
            $root = [IO.Path]::GetFullPath($evidence).TrimEnd([IO.Path]::DirectorySeparatorChar)
            $stack = [Collections.Generic.Stack[string]]::new(); $stack.Push($root)
            $files = @(); $directories = 0; [long]$total = 0; $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            while ($stack.Count) {
              $directory = $stack.Pop(); $item = Get-Item -LiteralPath $directory -Force
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Evidence links are refused' }
              foreach ($item in Get-ChildItem -LiteralPath $directory -Force) {
                if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Evidence links are refused' }
                $relative = [IO.Path]::GetRelativePath($root,$item.FullName).Replace('\','/')
                $parts = $relative.Split('/')
                if ($parts.Count -gt 32 -or $relative.Length -gt 2048 -or !$names.Add($relative) -or $parts.Where({ !$_ -or $_ -eq '.' -or $_ -eq '..' -or $_ -match '[\\:\x00-\x1f\x7f<>"|?*]' -or $_ -match '[ .]$' -or $_ -match '^(?i:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)' }).Count) { throw 'Unsafe or duplicate evidence path' }
                if ($item.PSIsContainer) { $directories++; if ($directories -gt 512) { throw 'Directory cap512 exceeded' }; $stack.Push($item.FullName) }
                else { if ($item.Length -gt 8*1024*1024) { throw 'Member cap8MiB exceeded' }; $total += $item.Length; if ($total -gt 48*1024*1024) { throw 'Raw cap48MiB exceeded' }; $files += @{ path=$relative; absolute=$item.FullName; bytes=$item.Length; sha256=(Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }; if ($files.Count -gt 96) { throw 'File cap96 exceeded' } }
              }
            }
            $zip = [IO.Compression.ZipFile]::Open($archive,[IO.Compression.ZipArchiveMode]::Create)
            try { foreach ($file in $files) { $item=Get-Item -LiteralPath $file.absolute -Force; if ($item.Length -ne $file.bytes -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Evidence changed before packaging' }; [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip,$file.absolute,$file.path,[IO.Compression.CompressionLevel]::Optimal) | Out-Null; if ((Get-FileHash -LiteralPath $file.absolute -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) { throw 'Evidence changed during packaging' } } } finally { $zip.Dispose() }
            if ((Get-Item -LiteralPath $archive).Length -gt 15*1024*1024) { throw 'Portable ZIP cap15MiB exceeded' }
            $zip=[IO.Compression.ZipFile]::OpenRead($archive)
            try{
              if($zip.Entries.Count -ne $files.Count){throw 'ZIP member census differs'}

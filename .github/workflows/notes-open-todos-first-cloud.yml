# New prospective Notes ordering campaign; all acceptance comes from fresh hosted evidence.
name: Notes open to-dos first current-source study
on:
  push:
    branches: [experiment/notes-open-todos-first-20261022-r3]
permissions:
  contents: read
concurrency:
  group: notes-open-todos-first-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  TZ: UTC
  REA_NOTES_ORDER_PARENT: 'cd4fbe97765a156b2dd591193ea3196b4d63b6b2'
  REA_SAFE_FEATURE_BRANCH: experiment/notes-open-todos-first-20261022-r3
  REA_NOTES_ORDER_MANIFEST_SHA256: '1a54e3914eb662f7aebf2270e3eccb61878c221292dabdcc555acff93dd872ff'
  REA_SAFE_CAPTURE_SHA256: '7455c38767075b332ec535b4c191324013fb66db2c53e4ce3cab2aa6e26370fe'
  REA_SAFE_COLLECTOR_SHA256: 'fd621891e3574d509dd6b207f0b51fa45c5fa0c22957b3b725d203c8d85a0394'
  REA_SAFE_BOOTSTRAP_SHA256: 'a1e02da6518a0f37d46165f417f8a98e012cef2e95799fa6b29d77b99cb43934'
  REA_SAFE_QUALIFIER_SHA256: 'ffc53495a3983662061c08d90dc25b3259510dbde07011b2163c2e4397ffb9df'
  REA_SAFE_FILTER_SHA256: 'd7f743e94a137379c1873e9a4f76411ff1614b616b624e1cc85fb489c0f2b68f'
  REA_SAFE_EVIDENCE_POLICY_SHA256: 'cd37248158a1ab50cc7f075e77bebc8d0b8482a10c44e7618e0edab70ebede1c'
  REA_SAFE_VALIDATOR_SHA256: '72ccee9a595d1a844be95b51a82436704a6cb41f4a1b79b553dd447a5125b300'
  REA_SAFE_CURRENT_FULL_RUNNER_SHA256: '498fd695bd7f2e923f2076bb950122259207bee68ec1a61341bfad35395653e1'
  REA_SAFE_PROGRESS_CONTRACT_SHA256: '45ee5d1f333ff1e99b3718cc4e89660c7166ccd05c0fab37758353822c728662'
  REA_SAFE_PROGRESS_REPORTER_SHA256: '7e4ef2da03d1972c214edeca0f5b80181e51b5c8b3bb90dfa91c58c9382f01b7'
  REA_SAFE_PROGRESS_CONTROLS_SHA256: 'd4a44a5bbb34ad8935732de9042c68d4290d53a9f6cc66fbf14e39312ecf85cc'
  REA_SAFE_DIAGNOSTIC_EXPORTER_SHA256: 'c914a3fd04105d099d5800ea3dd6bad946e886b2df5f2d3fae5ecd654c86f407'
  REA_SAFE_DIAGNOSTIC_CONTROLS_SHA256: 'a59fbdb4fb6a94e6c947691ba56fbe53b9a4c2ef1d73cb2a21e15bfa42dcfea7'
  REA_SAFE_DIAGNOSTIC_CONTAINMENT_SHA256: '094eef13ad898eb6a654e12fbf4640b2b880f67b61144ae86d5b5d988e05d5c3'
  REA_SAFE_ARCHIVE_METADATA_SHA256: '08497a24dcbe852df21a9afef32d366469cbba2ba4e322e40cf4ebacdbed1df3'
jobs:
  safe-evidence-controls:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      REA_NOTES_ORDER_ROLE: finite
    steps:
      - name: Enable long source paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out the exact prospective source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the reviewed runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          architecture: x64
          check-latest: false
      - name: Authenticate hosted context and fixed source entrypoints
        id: admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SERVER_URL -ne 'https://github.com' -or $env:GITHUB_REPOSITORY -ne 'Ginderlax/rea-research-lab' -or $env:GITHUB_REF -ne 'refs/heads/experiment/notes-open-todos-first-20261022-r3' -or $env:GITHUB_EVENT_NAME -ne 'push' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'HOSTED_SOURCE_CONTEXT_REFUSED' }
          $actualParent = & git --no-replace-objects rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $actualParent -ne 'cd4fbe97765a156b2dd591193ea3196b4d63b6b2') { throw 'SOURCE_PARENT_REFUSED' }
          $pins = @(
            @('products/rea-studio/experiments/notes-open-todos-first-20261021/CAMPAIGN.json', $env:REA_NOTES_ORDER_MANIFEST_SHA256),
            @('products/rea-studio/scripts/capture-notes-order-cloud-console.mjs', $env:REA_SAFE_CAPTURE_SHA256),
            @('products/rea-studio/scripts/verify-notes-open-todos-cloud.mjs', $env:REA_SAFE_COLLECTOR_SHA256),
            @('products/rea-studio/scripts/bootstrap-notes-open-todos-cloud.mjs', $env:REA_SAFE_BOOTSTRAP_SHA256),
            @('products/rea-studio/scripts/qualify-notes-open-todos-cloud.mjs', $env:REA_SAFE_QUALIFIER_SHA256),
            @('products/rea-studio/scripts/prepare-safe-notes-order-evidence.mjs', $env:REA_SAFE_FILTER_SHA256),
            @('products/rea-studio/scripts/validate-safe-notes-order-evidence.mjs', $env:REA_SAFE_VALIDATOR_SHA256),
            @('products/rea-studio/scripts/verify-cloud-current-installed.mjs', $env:REA_SAFE_CURRENT_FULL_RUNNER_SHA256),
            @('products/rea-studio/experiments/notes-open-todos-first-20261021/safe-evidence-policy.json', $env:REA_SAFE_EVIDENCE_POLICY_SHA256),
            @('products/rea-studio/scripts/notes-full-progress-contract.mjs', $env:REA_SAFE_PROGRESS_CONTRACT_SHA256),
            @('products/rea-studio/scripts/notes-full-progress-reporter.mjs', $env:REA_SAFE_PROGRESS_REPORTER_SHA256),
            @('products/rea-studio/scripts/notes-full-progress.cloud-check.mjs', $env:REA_SAFE_PROGRESS_CONTROLS_SHA256),
            @('products/rea-studio/scripts/export-safe-notes-full-progress.mjs', $env:REA_SAFE_DIAGNOSTIC_EXPORTER_SHA256),
            @('products/rea-studio/scripts/notes-full-diagnostic-exporter.cloud-check.mjs', $env:REA_SAFE_DIAGNOSTIC_CONTROLS_SHA256),
            @('products/rea-studio/scripts/notes-full-diagnostic-containment-child.mjs', $env:REA_SAFE_DIAGNOSTIC_CONTAINMENT_SHA256),
            @('products/rea-studio/scripts/project-notes-archive-original-metadata.mjs', $env:REA_SAFE_ARCHIVE_METADATA_SHA256)
          )
          foreach ($pin in $pins) {
            if ($pin[1] -notmatch '^[0-9a-f]{64}$') { throw 'UNBOUND_ENTRYPOINT_PIN' }
            $item = Get-Item -LiteralPath $pin[0] -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or (Get-FileHash -LiteralPath $pin[0] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin[1]) { throw 'SOURCE_ENTRYPOINT_PIN_REFUSED' }
          }
      - name: Exercise fresh synthetic privacy and source-admission controls
        id: controls
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-filter-validation-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase filter-validation --evidence "$raw"
          exit $LASTEXITCODE
      - name: Exercise fourteen closed progress and exporter metadata controls
        id: diagnostic_controls
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-diagnostic-validation-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase diagnostic-validation --evidence "$raw"
          exit $LASTEXITCODE
      - name: Finalize only the bounded synthetic control representation
        id: evidence
        if: always() && steps.admission.outcome == 'success'
        shell: pwsh
        run: |
          node products/rea-studio/scripts/validate-safe-notes-order-evidence.mjs --finalize
          exit $LASTEXITCODE
      - name: Preserve the synthetic control observations
        if: always() && steps.evidence.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes-order-safe-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Preserve only the closed fourteen-control summary
        if: always() && steps.diagnostic_controls.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes-order-diagnostic-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostic_controls.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  full-current-installed:
    needs: safe-evidence-controls
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      REA_NOTES_ORDER_ROLE: full
    steps:
      - name: Enable long source paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out the exact prospective source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the reviewed runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          architecture: x64
          check-latest: false
      - name: Authenticate hosted context and fixed source entrypoints
        id: admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SERVER_URL -ne 'https://github.com' -or $env:GITHUB_REPOSITORY -ne 'Ginderlax/rea-research-lab' -or $env:GITHUB_REF -ne 'refs/heads/experiment/notes-open-todos-first-20261022-r3' -or $env:GITHUB_EVENT_NAME -ne 'push' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'HOSTED_SOURCE_CONTEXT_REFUSED' }
          $actualParent = & git --no-replace-objects rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $actualParent -ne 'cd4fbe97765a156b2dd591193ea3196b4d63b6b2') { throw 'SOURCE_PARENT_REFUSED' }
          $pins = @(
            @('products/rea-studio/experiments/notes-open-todos-first-20261021/CAMPAIGN.json', $env:REA_NOTES_ORDER_MANIFEST_SHA256),
            @('products/rea-studio/scripts/capture-notes-order-cloud-console.mjs', $env:REA_SAFE_CAPTURE_SHA256),
            @('products/rea-studio/scripts/verify-notes-open-todos-cloud.mjs', $env:REA_SAFE_COLLECTOR_SHA256),
            @('products/rea-studio/scripts/bootstrap-notes-open-todos-cloud.mjs', $env:REA_SAFE_BOOTSTRAP_SHA256),
            @('products/rea-studio/scripts/qualify-notes-open-todos-cloud.mjs', $env:REA_SAFE_QUALIFIER_SHA256),
            @('products/rea-studio/scripts/prepare-safe-notes-order-evidence.mjs', $env:REA_SAFE_FILTER_SHA256),
            @('products/rea-studio/scripts/validate-safe-notes-order-evidence.mjs', $env:REA_SAFE_VALIDATOR_SHA256),
            @('products/rea-studio/scripts/verify-cloud-current-installed.mjs', $env:REA_SAFE_CURRENT_FULL_RUNNER_SHA256),
            @('products/rea-studio/experiments/notes-open-todos-first-20261021/safe-evidence-policy.json', $env:REA_SAFE_EVIDENCE_POLICY_SHA256),
            @('products/rea-studio/scripts/notes-full-progress-contract.mjs', $env:REA_SAFE_PROGRESS_CONTRACT_SHA256),
            @('products/rea-studio/scripts/notes-full-progress-reporter.mjs', $env:REA_SAFE_PROGRESS_REPORTER_SHA256),
            @('products/rea-studio/scripts/notes-full-progress.cloud-check.mjs', $env:REA_SAFE_PROGRESS_CONTROLS_SHA256),
            @('products/rea-studio/scripts/export-safe-notes-full-progress.mjs', $env:REA_SAFE_DIAGNOSTIC_EXPORTER_SHA256),
            @('products/rea-studio/scripts/notes-full-diagnostic-exporter.cloud-check.mjs', $env:REA_SAFE_DIAGNOSTIC_CONTROLS_SHA256),
            @('products/rea-studio/scripts/notes-full-diagnostic-containment-child.mjs', $env:REA_SAFE_DIAGNOSTIC_CONTAINMENT_SHA256),
            @('products/rea-studio/scripts/project-notes-archive-original-metadata.mjs', $env:REA_SAFE_ARCHIVE_METADATA_SHA256)
          )
          foreach ($pin in $pins) {
            if ($pin[1] -notmatch '^[0-9a-f]{64}$') { throw 'UNBOUND_ENTRYPOINT_PIN' }
            $item = Get-Item -LiteralPath $pin[0] -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or (Get-FileHash -LiteralPath $pin[0] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin[1]) { throw 'SOURCE_ENTRYPOINT_PIN_REFUSED' }
          }
      - name: Verify diagnostic channel containment on the actual full job
        id: diagnostic_containment
        shell: pwsh
        run: |
          $private = Join-Path $env:RUNNER_TEMP ('rea-notes-order-diagnostics-containment-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase diagnostics-containment --evidence "$private"
          exit $LASTEXITCODE
      - name: Require the owned diagnostic containment receipt
        shell: pwsh
        env:
          CONTAINMENT_PASSED: ${{ steps.diagnostic_containment.outputs.containment_passed }}
        run: |
          if ($env:CONTAINMENT_PASSED -ne 'true') { throw 'DIAGNOSTIC_CONTAINMENT_NOT_QUALIFIED' }
      - name: Preserve only the closed containment summary
        if: always() && steps.diagnostic_containment.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes-order-full-containment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostic_containment.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Capture current admitted source before prerequisites
        id: source_before
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase before --evidence "$raw"
          exit $LASTEXITCODE
      - name: Acquire only fresh role prerequisites
        id: prerequisites
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase bootstrap --evidence "$raw"
          exit $LASTEXITCODE
      - name: Run the explicitly admitted current role
        id: product
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase run --evidence "$raw"
          exit $LASTEXITCODE
      - name: Capture source after every attempted product phase
        id: source_after
        if: always() && steps.source_before.outcome == 'success'
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase after --evidence "$raw"
          exit $LASTEXITCODE
      - name: Qualify fresh source process and semantic evidence
        id: qualification
        if: always() && steps.product.outcome != 'skipped' && steps.source_before.outcome == 'success'
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase qualify --evidence "$raw"
          exit $LASTEXITCODE
      - name: Derive only the reviewed public evidence view
        id: evidence
        if: always() && steps.product.outcome != 'skipped' && steps.source_before.outcome == 'success'
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $env:REA_SAFE_EVIDENCE = Join-Path $env:RUNNER_TEMP ('rea-safe-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase filter --evidence "$raw"
          exit $LASTEXITCODE
      - name: Preserve safe failure diagnostics when the complete filter refuses
        id: diagnostic_evidence
        if: always() && steps.product.outcome != 'skipped' && steps.source_before.outcome == 'success' && steps.evidence.outcome != 'success'
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ('rea-notes-order-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node products/rea-studio/scripts/capture-notes-order-cloud-console.mjs --phase diagnostics --evidence "$raw"
          exit $LASTEXITCODE
      - name: Upload only the independent closed failure diagnostic
        if: always() && steps.diagnostic_evidence.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes-order-full-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostic_evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Preserve the bounded public evidence representation
        if: always() && steps.evidence.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes-order-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.artifact_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0


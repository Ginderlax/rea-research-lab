name: Notes46 installed source publication and delivery audit

on:
  push:
    branches: [experiment/notes46-installed-search-20261019]

permissions:
  contents: read

concurrency:
  group: notes46-installed-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication-integrity:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - name: Enable long research snapshot paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out actual new source and its fixed sole parent
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Select pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          architecture: x64
          check-latest: false
      - name: Authenticate every fixed source before JavaScript imports
        id: bootstrap
        shell: pwsh
        run: |
          if ($env:GITHUB_SERVER_URL -ne 'https://github.com' -or $env:GITHUB_REF -ne 'refs/heads/experiment/notes46-installed-search-20261019' -or $env:GITHUB_REPOSITORY -ne 'Ginderlax/rea-research-lab' -or $env:GITHUB_EVENT_NAME -ne 'push' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Unexpected actual hosted context' }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_RUN_ID -notmatch '^[1-9][0-9]*$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') { throw 'Invalid attempt identity' }
          Get-ChildItem Env: | Where-Object { $_.Name -match '^GIT_' } | ForEach-Object { Remove-Item -LiteralPath ('Env:' + $_.Name) }
          $env:GIT_NO_REPLACE_OBJECTS='1'; $env:GIT_NO_LAZY_FETCH='1'; $env:GIT_OPTIONAL_LOCKS='0'; $env:GIT_TERMINAL_PROMPT='0'
          $currentSourceParent='35a9e686e8cd21e5a7618cfcea5f4c1aa01dc71d'; $reviewedSourceGrandparent='ab26bf14bc1a55a723566bbafb3ca391c3ef671c'; $reviewedSourceGreatGrandparent='cee2da08f7ebe81a003a6cc9828655794be48cb0'; $reviewedSourceFourthAncestor='40c7df91936aaf9574801aa38c5a635f299e6e39'; $historicalInputCommit='2a8482b42784eb262d6d5b82e62d8d1220dc4821'
          $actual = & git --no-replace-objects rev-list --parents -n 1 HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne ($env:GITHUB_SHA + ' ' + $currentSourceParent)) { throw 'Actual new commit must have the fixed immediate source parent' }
          $parentAncestry = & git --no-replace-objects rev-list --parents -n 1 $currentSourceParent
          if ($LASTEXITCODE -ne 0 -or $parentAncestry -cne ($currentSourceParent + ' ' + $reviewedSourceGrandparent)) { throw 'Current source parent must retain the reviewed source grandparent' }
          $grandparentAncestry = & git --no-replace-objects rev-list --parents -n 1 $reviewedSourceGrandparent
          if ($LASTEXITCODE -ne 0 -or $grandparentAncestry -cne ($reviewedSourceGrandparent + ' ' + $reviewedSourceGreatGrandparent)) { throw 'Reviewed source grandparent must retain the reviewed source great-grandparent' }
          $greatGrandparentAncestry = & git --no-replace-objects rev-list --parents -n 1 $reviewedSourceGreatGrandparent
          if ($LASTEXITCODE -ne 0 -or $greatGrandparentAncestry -cne ($reviewedSourceGreatGrandparent + ' ' + $reviewedSourceFourthAncestor)) { throw 'Reviewed source great-grandparent must retain the reviewed fourth ancestor' }
          $fourthAncestorAncestry = & git --no-replace-objects rev-list --parents -n 1 $reviewedSourceFourthAncestor
          if ($LASTEXITCODE -ne 0 -or $fourthAncestorAncestry -cne ($reviewedSourceFourthAncestor + ' ' + $historicalInputCommit)) { throw 'Reviewed fourth source ancestor must retain the fixed historical fifth ancestor' }
          $dirty = & git --no-replace-objects status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Actual checkout must be clean before execution' }
          if ((& node --version) -cne 'v24.16.0' -or $LASTEXITCODE -ne 0) { throw 'Pinned Node runtime required' }
          function Assert-NoLinks([string]$filename) {
            $at=[IO.Path]::GetFullPath($filename)
            while ($true) { $item=Get-Item -LiteralPath $at -Force; if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Source ancestor links refused' }; $parent=[IO.Path]::GetDirectoryName($at); if (!$parent -or $parent -eq $at) { break }; $at=$parent }
          }
          Assert-NoLinks $env:GITHUB_WORKSPACE; Assert-NoLinks $env:RUNNER_TEMP

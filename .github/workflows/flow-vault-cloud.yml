name: Cloud Flow and Vault verification

on:
  push:
    branches: [codex/rea-cloud-recovery-20261015]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flow-vault:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Enable exact-byte checkout of long research snapshot paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out the exact source revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Select the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          architecture: x64
          check-latest: false

      - name: Select a unique evidence directory outside the source census
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('rea-flow-vault-ci-evidence-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          'REA_CI_EVIDENCE=' + $evidence | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire authenticated test-only original prerequisites
        id: prerequisites
        shell: pwsh
        run: node products/rea-studio/scripts/bootstrap-cloud-flow-vault.mjs --evidence "$env:REA_CI_EVIDENCE"

      - name: Verify collector failure closure with isolated synthetic controls
        id: collector_controls
        shell: pwsh
        run: |
          $controls = Join-Path $env:REA_CI_EVIDENCE 'collector-controls'
          node products/rea-studio/scripts/verify-cloud-controls.mjs --output "$controls"

      - name: Run the finite current Flow and Vault suite
        id: finite_verification
        shell: pwsh
        run: |
          $manifest = Join-Path $env:REA_CI_EVIDENCE 'prerequisite-acquisition.json'
          node products/rea-studio/scripts/verify-cloud.mjs --scope flow-vault --output "$env:REA_CI_EVIDENCE" --bootstrap-manifest "$manifest" --timeout-ms 1200000

      - name: Package portable evidence within the storage limit
        id: evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('rea-flow-vault-ci-evidence-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          @{ schema = 'rea-cloud-workflow-attempt/v1'; sourceCommit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; runnerEnvironment = $env:RUNNER_ENVIRONMENT; checkoutOutcome = '${{ steps.checkout.outcome }}'; prerequisiteOutcome = '${{ steps.prerequisites.outcome }}'; collectorControlsOutcome = '${{ steps.collector_controls.outcome }}'; finiteVerificationOutcome = '${{ steps.finite_verification.outcome }}'; statusBeforePackaging = '${{ job.status }}'; productTestsClaimed = $false } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'workflow-attempt.json') -Encoding utf8
          $archive = Join-Path $env:RUNNER_TEMP ('rea-flow-vault-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($evidence, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          $limit = 15 * 1024 * 1024
          if ($archiveBytes -gt $limit) {
            $fallback = Join-Path $env:RUNNER_TEMP ('rea-flow-vault-storage-failure-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
            New-Item -ItemType Directory -Path $fallback | Out-Null
            $retained = @()
            $omitted = @()
            $tailed = @()
            foreach ($name in @('attempt-validation.json', 'events.jsonl', 'stdout.txt', 'stderr.txt', 'source-before.json', 'source-after.json', 'prerequisite-acquisition.json', 'windows-tar-readiness.json', 'workflow-attempt.json')) {
              $candidate = Join-Path $evidence $name
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $bytes = (Get-Item -LiteralPath $candidate).Length
                if ($bytes -le 1024 * 1024) { Copy-Item -LiteralPath $candidate -Destination (Join-Path $fallback $name); $retained += $name }
                elseif ($name -in @('stdout.txt', 'stderr.txt')) {
                  $tailName = $name.Replace('.txt', '.tail.txt')
                  $logInput = [System.IO.File]::OpenRead($candidate)
                  $logTail = [System.IO.File]::Create((Join-Path $fallback $tailName))
                  try { $logInput.Position = [Math]::Max(0, $logInput.Length - 256 * 1024); $logInput.CopyTo($logTail) }
                  finally { $logTail.Dispose(); $logInput.Dispose() }
                  $retained += $tailName
                  $tailed += @{ original = $name; originalBytes = $bytes; retainedTailBytes = 256 * 1024 }
                }
                else { $omitted += @{ name = $name; bytes = $bytes } }
              }
            }
            $controlsSummary = Join-Path $evidence 'collector-controls/controls-validation.json'
            if (Test-Path -LiteralPath $controlsSummary -PathType Leaf) {
              $controlsBytes = (Get-Item -LiteralPath $controlsSummary).Length
              if ($controlsBytes -le 1024 * 1024) {
                Copy-Item -LiteralPath $controlsSummary -Destination (Join-Path $fallback 'collector-controls-validation.json')
                $retained += 'collector-controls-validation.json'
              } else { $omitted += @{ name = 'collector-controls/controls-validation.json'; bytes = $controlsBytes } }
            }
            @{ schema = 'rea-cloud-evidence-storage-failure/v1'; status = 'failed'; fullArchiveBytes = $archiveBytes; limitBytes = $limit; fullEvidenceUploaded = $false; sourceSnapshotsUploaded = $false; retainedFiles = $retained; truncatedLogs = $tailed; omittedLargeTopLevelFiles = $omitted; reason = 'Full portable evidence exceeded the explicitly bounded artifact budget. The fallback is incomplete; do not claim complete evidence backup. Complete streaming test logs may remain available in the Actions console.' } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $fallback 'storage-failure.json') -Encoding utf8
            $archive = Join-Path $env:RUNNER_TEMP ('rea-flow-vault-incomplete-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.zip')
            [System.IO.Compression.ZipFile]::CreateFromDirectory($fallback, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $false)
            'artifact_path=' + $archive | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw 'Portable evidence exceeded 15 MiB; only the explicitly incomplete diagnostic fallback will be uploaded.'
          }
          'artifact_path=' + $archive | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Preserve evidence even when acquisition or tests fail
        if: always() && steps.evidence.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-vault-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

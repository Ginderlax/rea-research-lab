# Prospective next-feature integration, not an authorization to rerun an old
# product. All __REVIEWED_*__ seams block dispatch until root final composition.
name: Prospective Archive feature with safe evidence
on:
  workflow_dispatch:
  push:
    branches: ['__REVIEWED_NEXT_FEATURE_BRANCH__']
permissions:
  contents: read
concurrency:
  group: archive-safe-evidence-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  REA_ARCHIVE_ZIP_PARENT: '6aeb166588d834c9635940e542b2de4e98b1eaf2'
  REA_SAFE_FEATURE_BRANCH: '__REVIEWED_NEXT_FEATURE_BRANCH__'
  REA_ARCHIVE_ZIP_MANIFEST_SHA256: '__REVIEWED_SOURCE_MANIFEST_SHA256__'
  REA_ARCHIVE_ZIP_ADMISSION_SCRIPT_SHA256: '1cb262ec35614783f456fbfec68aef910ab633ffa4575c8e0758e6cebc8d8a34'
  REA_SAFE_CAPTURE_SHA256: 'e7490d623f27f862906de1d09a4f55eef62d0591344ae82d51463f848e8a4b9c'
  REA_SAFE_FILTER_SHA256: '9fa0bfecb53c4a946a5e41987363bb61b3522c0cf16e4181afb32ecbc47f806b'
  REA_SAFE_COLLECTOR_SHA256: 'f5d3d74ff2045679a5d08399748e79660f94939103f9ceaadb915c47d2fc0e9d'
  REA_SAFE_EVIDENCE_POLICY_SHA256: '1c9df2389217ce81302f4a68535f40a6452f805674e1f662a609a78235979c21'
jobs:
  validate:
    name: Safe Archive feature / ${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        role: [finite, zip-original, browser]
    env:
      REA_ARCHIVE_ZIP_ROLE: ${{ matrix.role }}
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - name: Enable long source paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out actual source and fixed sole parent
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Select exact Windows x64 Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          architecture: x64
          check-latest: false
      - name: Choose new owned unuploaded staging and safe-view paths
        shell: pwsh
        run: |
          $raw=Join-Path $env:RUNNER_TEMP ('rea-archive-zip-aes-'+$env:REA_ARCHIVE_ZIP_ROLE+'-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $safe=Join-Path $env:RUNNER_TEMP ('rea-safe-archive-'+$env:REA_ARCHIVE_ZIP_ROLE+'-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $cache=Join-Path $env:RUNNER_TEMP ('rea-safe-archive-chromium-'+$env:REA_ARCHIVE_ZIP_ROLE+'-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          foreach($owned in @($raw,$safe,$cache)){if(Test-Path -LiteralPath $owned){throw 'Refuse earlier owned output.'}}
          New-Item -ItemType Directory -Path $cache|Out-Null
          'REA_ARCHIVE_ZIP_EVIDENCE='+$raw|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'REA_SAFE_EVIDENCE='+$safe|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'PLAYWRIGHT_BROWSERS_PATH='+$cache|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Authenticate launcher before project JavaScript
        id: launcher
        shell: pwsh
        run: |
          $pairs=@(@('products/rea-studio/scripts/capture-safe-cloud-console.mjs',$env:REA_SAFE_CAPTURE_SHA256),@('products/rea-studio/scripts/prepare-safe-cloud-evidence.mjs',$env:REA_SAFE_FILTER_SHA256),@('products/rea-studio/scripts/verify-archive-zip-aes-cloud.mjs',$env:REA_SAFE_COLLECTOR_SHA256),@('products/rea-studio/scripts/archive-zip-aes-source-admission.ps1',$env:REA_ARCHIVE_ZIP_ADMISSION_SCRIPT_SHA256),@('products/rea-studio/experiments/archive-safe-evidence/policy.json',$env:REA_SAFE_EVIDENCE_POLICY_SHA256))
          foreach($pair in $pairs){if($pair[1] -cnotmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pair[1]){throw 'Reviewed gate source hash required.'}}
          if($env:REA_ARCHIVE_ZIP_MANIFEST_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:REA_SAFE_FEATURE_BRANCH.StartsWith('__') -or $env:GITHUB_REF -cne ('refs/heads/'+$env:REA_SAFE_FEATURE_BRANCH)){throw 'Final reviewed feature source composition required.'}
      - name: Admit complete actual source with captured console
        id: before
        if: steps.launcher.outcome == 'success'
        shell: pwsh
        run: node products/rea-studio/scripts/capture-safe-cloud-console.mjs --phase before --evidence "$env:REA_ARCHIVE_ZIP_EVIDENCE"
      - name: Run next admitted feature with no raw console forwarding
        id: verify
        if: steps.before.outcome == 'success'
        shell: pwsh
        run: node products/rea-studio/scripts/capture-safe-cloud-console.mjs --phase run --evidence "$env:REA_ARCHIVE_ZIP_EVIDENCE"
      - name: Recheck every source after success or failure
        id: after
        if: always() && steps.before.outcome != '' && steps.before.outcome != 'skipped'
        shell: pwsh
        run: |
          $capture='products/rea-studio/scripts/capture-safe-cloud-console.mjs'
          if((Get-FileHash -LiteralPath $capture -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:REA_SAFE_CAPTURE_SHA256){throw 'Reviewed console capture changed.'}
          node $capture --phase after --evidence "$env:REA_ARCHIVE_ZIP_EVIDENCE"
      - name: Admit complete privacy-filtered safe evidence or fixed safe diagnostics
        id: evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try {
            if($env:REA_ARCHIVE_ZIP_ROLE -notin @('finite','zip-original','browser') -or $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:GITHUB_RUN_ID -cnotmatch '^[1-9][0-9]*$' -or $env:GITHUB_RUN_ATTEMPT -cnotmatch '^[1-9][0-9]*$'){throw 'Safe identity not available.'}
            $expectedRaw=Join-Path $env:RUNNER_TEMP ('rea-archive-zip-aes-'+$env:REA_ARCHIVE_ZIP_ROLE+'-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
            $expectedSafe=Join-Path $env:RUNNER_TEMP ('rea-safe-archive-'+$env:REA_ARCHIVE_ZIP_ROLE+'-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
            if($env:REA_ARCHIVE_ZIP_EVIDENCE -cne $expectedRaw -or $env:REA_SAFE_EVIDENCE -cne $expectedSafe -or -not(Test-Path -LiteralPath $expectedRaw)){throw 'Owned source staging unavailable.'}
            $rawItem=Get-Item -LiteralPath $expectedRaw
            if(-not $rawItem.PSIsContainer -or ($rawItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'Owned staging must be ordinary.'}
            @{schema='rea-archive-zip-aes-workflow/v1';role=$env:REA_ARCHIVE_ZIP_ROLE;sourceCommit=$env:GITHUB_SHA;sourceParent=$env:REA_ARCHIVE_ZIP_PARENT;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;checkoutOutcome='${{ steps.checkout.outcome }}';sourceBeforeOutcome='${{ steps.before.outcome }}';verificationOutcome='${{ steps.verify.outcome }}';sourceAfterOutcome='${{ steps.after.outcome }}';sourceOverlay=$false;fullSuite=$false;historicalReceiptsRebound=$false;fullParity=$false;superiority=$false;uploadedRepresentation='privacy-filtered-safe-view';rawCompleteEvidenceUploadAllowed=$false}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $expectedRaw 'workflow-attempt.json') -Encoding utf8
            $filter='products/rea-studio/scripts/prepare-safe-cloud-evidence.mjs'
            $policy='products/rea-studio/experiments/archive-safe-evidence/policy.json'
            if($env:REA_SAFE_FILTER_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $filter -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:REA_SAFE_FILTER_SHA256 -or (Get-FileHash -LiteralPath $policy -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:REA_SAFE_EVIDENCE_POLICY_SHA256){throw 'Reviewed safe filter/policy changed.'}
            node $filter --raw $expectedRaw --output $expectedSafe --policy $policy
            if($LASTEXITCODE -ne 0){throw 'Safe view not admitted.'}
          } catch {
            # Deliberately no raw copy, captured child message, exception text,
            # matched snippets, token/URL or unclassified log/source fallback.
            $diagnostic=Join-Path $env:RUNNER_TEMP ('rea-safe-archive-diagnostic-${{ matrix.role }}-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
            if(Test-Path -LiteralPath $diagnostic){throw 'Refuse earlier safe diagnostic.'}
            New-Item -ItemType Directory -Path $diagnostic|Out-Null
            $source=if($env:GITHUB_SHA -cmatch '^[0-9a-f]{40}$'){$env:GITHUB_SHA}else{'unqualified'}
            @{schema='rea-safe-cloud-diagnostic-only/v1';status='failed';source=$source;role='${{ matrix.role }}';reasonCode='SAFE_EVIDENCE_UNAVAILABLE';completeRawEvidenceUploaded=$false;sourceBodiesUploaded=$false;rawLogsComplete=$false;productAcceptance=$false;profileValuesOrSnippetsRetained=$false}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $diagnostic 'safe-diagnostic.json') -Encoding utf8
            'artifact_path='+$diagnostic|Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw 'Safe evidence unavailable; fixed sanitized diagnostics only, no acceptance.'
          }
      - name: Preserve only the admitted safe view without changing failed gates
        if: always() && steps.evidence.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-privacy-filtered-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.artifact_path }}
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

          '@ | ConvertFrom-Json
          # Exact non-workflow sources are pinned; this workflow is separately Git-authenticated and captured.
          if ($pins.Count -ne 165) { throw 'Exact165-source bootstrap roster required' }
          $seen=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($pin in $pins) {
            $relative=[string]$pin.path
            if (!$seen.Add($relative) -or $relative -match '[\\:\x00-\x1f\x7f<>"|?*]' -or $relative.StartsWith('/') -or $relative.Split('/').Where({ !$_ -or $_ -eq '.' -or $_ -eq '..' -or $_ -match '[ .]$' }).Count -or $pin.bytes -le 0 -or $pin.bytes -gt 512*1024 -or $pin.sha256 -notmatch '^[0-9a-f]{64}$' -or $pin.gitBlob -notmatch '^[0-9a-f]{40}$') { throw 'Invalid fixed source row' }
            $filename=Join-Path $env:GITHUB_WORKSPACE $relative; Assert-NoLinks $filename
            $item=Get-Item -LiteralPath $filename -Force
            if ($item.PSIsContainer -or $item.Length -ne $pin.bytes -or (Get-FileHash -LiteralPath $filename -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.sha256) { throw ('Reviewed physical source differs: '+$relative) }
            $gitrow=& git --no-replace-objects ls-files --stage -- $relative
            if ($LASTEXITCODE -ne 0 -or $gitrow -cne ('100644 '+$pin.gitBlob+' 0'+[char]9+$relative)) { throw ('Actual current source Git identity differs: '+$relative) }
          }

      - name: Execute documented current CLI with bounded raw streams
        id: qualify
        shell: pwsh
        run: |
          $role='audit'; $prefix='rea-proof-delivery-audit-'; $script='scripts/audit-proof-delivery.mjs'; $argument='--output'
          $evidence=Join-Path $env:RUNNER_TEMP ($prefix+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $launcher=Join-Path $env:RUNNER_TEMP ('rea-notes46-'+$role+'-launcher-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if ((Test-Path -LiteralPath $evidence) -or (Test-Path -LiteralPath $launcher)) { throw 'Owned output roots must be new' }
          New-Item -ItemType Directory -Path $launcher | Out-Null
          # BCL byte streams preserve raw bytes; compilation happens only in this hosted job.
          Add-Type -TypeDefinition @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Threading.Tasks;
          public sealed class Notes46Drain {
            public long Observed, Retained, Dropped; public string Failure;
          }
          public static class Notes46OwnedProcess {
            public static async Task<Notes46Drain> Drain(Stream input, FileStream output, long cap, Process owned) {
              var result=new Notes46Drain(); var buffer=new byte[8192];
              try {
                int count; while ((count=await input.ReadAsync(buffer,0,buffer.Length))!=0) {
                  result.Observed+=count; int retain=(int)Math.Min(count,Math.Max(0,cap-result.Retained));
                  if(retain>0){await output.WriteAsync(buffer,0,retain); await output.FlushAsync(); result.Retained+=retain;}
                  result.Dropped+=count-retain;
                  if(retain!=count){try{owned.Kill(true);}catch(Exception error){result.Failure="Overflow kill: "+error.Message;}}
                }
              } catch(Exception error){result.Failure=error.GetType().Name+": "+error.Message;try{owned.Kill(true);}catch{}}
              return result;
            }
          }
          '@
          $nodeCommands=@(Get-Command node -CommandType Application)
          if($nodeCommands.Count -lt 1){throw 'Pinned Node command was not found'}
          $nodeExecutable=[string]$nodeCommands[0].Source
          if(![IO.Path]::IsPathFullyQualified($nodeExecutable)){throw 'Selected Node executable must be one absolute path'}
          $nodeItem=Get-Item -LiteralPath $nodeExecutable -Force
          if($nodeItem.PSIsContainer -or ($nodeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $nodeItem.Name -ine 'node.exe'){throw 'Selected Node executable must be a regular node.exe'}
          $nodeVersion=@(& $nodeExecutable --version)
          if($LASTEXITCODE -ne 0 -or $nodeVersion.Count -ne 1 -or $nodeVersion[0] -cne 'v24.16.0'){throw 'Selected Node executable must report exactly v24.16.0'}
          $psi=[Diagnostics.ProcessStartInfo]::new(); $psi.FileName=$nodeExecutable
          $psi.UseShellExecute=$false; $psi.CreateNoWindow=$true; $psi.WorkingDirectory=$env:GITHUB_WORKSPACE
          $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
          $psi.ArgumentList.Add($script); $psi.ArgumentList.Add($argument); $psi.ArgumentList.Add($evidence)
          $psi.Environment.Remove('NODE_OPTIONS') | Out-Null; $psi.Environment.Remove('NODE_PATH') | Out-Null
          $process=[Diagnostics.Process]::new();$process.StartInfo=$psi
          $stdout=[IO.File]::Open((Join-Path $launcher 'workflow-process.stdout.txt'),[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::Read)
          $stderr=[IO.File]::Open((Join-Path $launcher 'workflow-process.stderr.txt'),[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::Read)
          $record=@{schema='rea-notes46-owned-workflow-process/v1';role=$role;sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;job=$env:GITHUB_JOB;script=$script;argument=$argument;nodeExecutable=$nodeExecutable;nodeVersion=$nodeVersion[0];nodeCandidateCount=$nodeCommands.Count;nodeResolution='first ApplicationInfo in actual PATH order';startedAtUtc=[DateTime]::UtcNow.ToString('o');exitCode=$null;closeObserved=$false;timedOut=$false;failure=$null;rawStreamEncodingConversion=$false;stdoutCap=4*1024*1024;stderrCap=1024*1024;comprehensiveAuditFailureWaived=$false}
          try {
            if (!$process.Start()) { throw 'Owned process did not start' }; $record.pid=$process.Id
            $outTask=[Notes46OwnedProcess]::Drain($process.StandardOutput.BaseStream,$stdout,4*1024*1024,$process)
            $errTask=[Notes46OwnedProcess]::Drain($process.StandardError.BaseStream,$stderr,1024*1024,$process)
            if (!$process.WaitForExit(3300000)) { $record.timedOut=$true;try{$process.Kill($true)}catch{$record.failure=$_.Exception.Message}; if (!$process.WaitForExit(10000)) { throw 'Owned process remained open after deadline kill' } }
            $record.closeObserved=$process.HasExited; $record.exitCode=$process.ExitCode
            if (![Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($outTask,$errTask),10000)) { try{$process.StandardOutput.BaseStream.Dispose()}catch{};try{$process.StandardError.BaseStream.Dispose()}catch{};throw 'Owned raw streams did not close in bounded interval' }
            $record.stdout=$outTask.Result; $record.stderr=$errTask.Result
            if ($record.timedOut -or !$record.closeObserved -or $record.stdout.Dropped -or $record.stderr.Dropped -or $record.stdout.Failure -or $record.stderr.Failure) { throw 'Owned process or raw stream qualification failed' }
          } catch { $record.failure=$_.Exception.Message; try{if(!$process.HasExited){$process.Kill($true);$process.WaitForExit(10000)|Out-Null}}catch{} }
          finally { $record.completedAtUtc=[DateTime]::UtcNow.ToString('o');$stdout.Flush($true);$stderr.Flush($true);$stdout.Dispose();$stderr.Dispose();$process.Dispose();$record|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $launcher 'workflow-process.json') -Encoding utf8 }
          # Historical comprehensive coverage exit1 remains a real failed job.
          if ($record.failure -or $record.exitCode -ne 0) { throw ('Actual '+$role+' process failed; raw streams retained. Exit='+$record.exitCode+'; '+$record.failure) }

      - name: Package bounded portable raw evidence even on failure
        id: evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('rea-proof-delivery-audit-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (!(Test-Path -LiteralPath $evidence)) { New-Item -ItemType Directory -Path $evidence | Out-Null }
          function Assert-NoEvidenceLinks([string]$filename) {
            $at=[IO.Path]::GetFullPath($filename)
            while($true){$item=Get-Item -LiteralPath $at -Force;if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Evidence ancestor links refused'};$parent=[IO.Path]::GetDirectoryName($at);if(!$parent -or $parent -eq $at){break};$at=$parent}
          }
          Assert-NoEvidenceLinks $evidence
          $launcher=Join-Path $env:RUNNER_TEMP ('rea-notes46-audit-launcher-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $launcher){
            Assert-NoEvidenceLinks $launcher
            foreach($name in @('workflow-process.json','workflow-process.stdout.txt','workflow-process.stderr.txt')){
              $src=Join-Path $launcher $name
              if(Test-Path -LiteralPath $src -PathType Leaf){
                Assert-NoEvidenceLinks $src;$item=Get-Item -LiteralPath $src -Force;if($item.Length -gt 4*1024*1024){throw 'Launcher member cap exceeded'}
                $bytes=[IO.File]::ReadAllBytes($src);$dst=Join-Path $evidence $name;$stream=[IO.File]::Open($dst,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                try{$stream.Write($bytes,0,$bytes.Length);$stream.Flush($true)}finally{$stream.Dispose()}
